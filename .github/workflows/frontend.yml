name: Frontend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'

permissions:
  id-token: write
  contents: read

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Vue App
        run: npm run build

      - name: Deploy to S3
        run: |
          # 替换为你的 S3 桶名称
          aws s3 sync ./dist s3://finclear-dev-frontend --delete

      - name: Invalidate CloudFront Cache
        run: |
          # 替换为你的 CloudFront Distribution ID
          aws cloudfront create-invalidation --distribution-id E27HAM7B2MKK84 --paths "/*"