name: Backend CI/CD (FastAPI to AWS Lambda)

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

permissions:
  id-token: write
  contents: read

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::333076556197:role/GitHubActions-OIDC-Role
          aws-region: ap-northeast-1

      - name: Install & Package Dependencies
        run: |
          mkdir -p package
          
          # 【修改点 2】使用你验证过的命令。去掉了之前的 || 降级逻辑，防止它在失败时回退到错误架构编译
          pip install -r requirements.txt -t package -U --platform manylinux2014_aarch64 --python-version 3.13 --only-binary=:all:
          
          # 压缩第三方依赖
          cd package
          zip -r ../deployment.zip .
          cd ..
          
          # 将 FastAPI 业务代码追加打包进 deployment.zip
          zip -g deployment.zip -r . -x "package/*" ".git*" "*__pycache__*" "*.pytest_cache*" "venv/*" "tests/*"


      - name: Deploy Code to AWS Lambda
        run: |
          # 替换为你的 Lambda 函数名称
          aws lambda update-function-code \
            --function-name finclear-dev-lambda \
            --zip-file fileb://deployment.zip

      - name: Wait for Lambda Update Complete
        run: |
          # 确保函数代码更新状态完成后再结束 Job
          aws lambda wait function-updated --function-name finclear-dev-lambda