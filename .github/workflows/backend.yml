name: Backend CI/CD (FastAPI to AWS Lambda)

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

permissions:
  id-token: write
  contents: read

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::333076556197:role/GitHubActions-OIDC-Role
          aws-region: ap-northeast-1

      - name: Install & Package Dependencies
        run: |
          mkdir -p package
          # 针对 Lambda (Linux x86_64) 环境精准下载 Wheel 包（解决 Pydantic v2 等 C 扩展包兼容性问题）
          pip install \
            --platform manylinux2014_aarch64 \
            --target ./package \
            --implementation cp \
            --python-version 3.11 \
            --only-binary=:all: \
            -r requirements.txt || pip install --target ./package -r requirements.txt

          # 打包第三方依赖
          cd package
          zip -r ../deployment.zip .
          cd ..

          # 将 FastAPI 业务代码追加打包进 deployment.zip
          zip -g deployment.zip -r . -x "package/*" ".git*" "*__pycache__*" "*.pytest_cache*" "venv/*" "tests/*"

      - name: Deploy Code to AWS Lambda
        run: |
          # 替换为你的 Lambda 函数名称
          aws lambda update-function-code \
            --function-name finclear-dev-lambda \
            --zip-file fileb://deployment.zip

      - name: Wait for Lambda Update Complete
        run: |
          # 确保函数代码更新状态完成后再结束 Job
          aws lambda wait function-updated --function-name finclear-dev-lambda